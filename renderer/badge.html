<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>OverLIVE toggle</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  body { display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-start; gap: 6px; padding-top: 6px; box-sizing: border-box; font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif; }
  /* Apex の操作ヒントと同じ「斜めに切った帯」。大きさは画面の高さに合わせて main 側で拡縮 */
  .badge {
    width: 300px; box-sizing: border-box; justify-content: flex-start;
    --aqua: #63e6ff; --aqua-soft: rgba(99, 230, 255, .55); --ink: #eaf8ff;
    position: relative; display: flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 16px 0 14px; margin-right: 6px;
    background: linear-gradient(90deg, rgba(14, 34, 66, .62), rgba(10, 26, 52, .50));
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
    color: var(--ink); opacity: .9; transition: opacity .25s, filter .25s;
  }
  .badge::before {   /* 発光の縁 */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    clip-path: inherit; border: 1.5px solid var(--aqua-soft);
    box-shadow: inset 0 0 10px rgba(99, 230, 255, .35);
  }
  .cat { width: 26px; height: 26px; flex: none; filter: drop-shadow(0 0 4px var(--aqua)); }
  .name { flex: 1; font-weight: 700; font-size: 14px; letter-spacing: .06em; white-space: nowrap; text-shadow: 0 0 6px rgba(99, 230, 255, .6); }
  .key { font: 600 12px/1 "Segoe UI", sans-serif; color: #fff; padding: 5px 7px; border-radius: 4px;
         border: 1px solid rgba(255, 255, 255, .75); background: rgba(255, 255, 255, .08); white-space: nowrap; }
  .state { font: 800 12px/1 "Segoe UI", sans-serif; letter-spacing: .08em; padding: 5px 8px; border-radius: 999px; min-width: 44px; text-align: center; }
  .on  .state { color: #062433; background: var(--aqua); box-shadow: 0 0 10px var(--aqua); }
  .off .state { color: #c9d3dd; background: rgba(160, 175, 190, .25); }
  .off { opacity: .55; filter: saturate(.3); }
  .trial .state { color: #3a0d22; background: #ffb3d9; box-shadow: 0 0 10px #ff8fc8; min-width: 56px; }
  /* 2026-11-01（ユーザー指摘）：「のこり 58分」の数字だけ Segoe UI（太字800）、かなは日本語フォントになり、8 だけ大きく見えた
     → 体験版の残り時間は文字も数字も日本語フォント1つでそろえる（数字は等幅で、58→57 と変わっても幅が動かない） */
  .trial .state { font-family: "Yu Gothic UI", "Meiryo UI", "Meiryo", sans-serif; font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .trial.low .state { background: #ff6b7a; color: #fff; }
  /* のこり5分：一度だけ名前の欄に「あと5分だよ！」を出す。のこり1分：数字がゆっくり点滅 */
  .trial.notice .name { color: #ffd6ea; text-shadow: 0 0 8px #ff8fc8; animation: pop .6s ease-out; }
  .trial.last .state { animation: blink 1.6s ease-in-out infinite; }
  @keyframes pop { 0% { transform: scale(1.25); filter: brightness(1.8); } 100% { transform: none; filter: none; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .badge[hidden] { display: none; }
  .flash { animation: flash .5s ease-out; }
  @keyframes flash { 0% { filter: brightness(2); } 100% { filter: none; } }
</style>
</head>
<body>
  <div class="badge on" id="b">
    <svg class="cat" viewBox="0 0 32 32" aria-hidden="true">
      <!-- OverLIVE のマーク：重なった2つの枠と緑の点（アイコンと同じ形） -->
      <defs>
        <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#2f5cff"/></linearGradient>
        <linearGradient id="gf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5afae6"/><stop offset=".6" stop-color="#40eefc"/><stop offset="1" stop-color="#4aa8ff"/></linearGradient>
      </defs>
      <rect x="3.5" y="11" width="17" height="14.5" rx="4" fill="none" stroke="url(#gb)" stroke-width="2.6"/>
      <rect x="11" y="5.5" width="17.5" height="14.5" rx="4" fill="#0a1d44" stroke="url(#gf)" stroke-width="2.6"/>
      <circle cx="24" cy="9.8" r="1.9" fill="#3bf5c0"/>
    </svg>
    <span class="name">OverLIVE</span>
    <span class="key" id="key">Alt+H</span>
    <span class="state" id="st">ON</span>
  </div>
  <div class="badge off" id="m">
    <svg class="cat" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="5" y="7" width="22" height="3" rx="1.5" fill="#63e6ff"/>
      <rect x="5" y="14.5" width="22" height="3" rx="1.5" fill="#63e6ff"/>
      <rect x="5" y="22" width="22" height="3" rx="1.5" fill="#63e6ff"/>
      <circle cx="25" cy="8.5" r="3.2" fill="#3bf5c0"/>
    </svg>
    <span class="name">MENU</span>
    <span class="key" id="mkey">Alt+M</span>
    <span class="state" id="mst">OPEN</span>
  </div>
  <div class="badge trial" id="t" hidden>
    <svg class="cat" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="#ffb3d9" stroke-width="2.4"/><path d="M16 9 V16 L21 19" stroke="#ffb3d9" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    <span class="name">体験版</span>
    <span class="state" id="tst">60分</span>
  </div>
<script src="badge.js"></script>
</body>
</html>
