// ===== 立体のレーザー（奥行きのある空間：床のグリッド・もや・奥のステージから手前へ伸びるビーム） =====
function proj(x, y, z, cz) { const f = 900 / Math.max(40, z - cz); return [CX + x * f, CY + y * f, f]; }
function lasers3d(t, a) {
