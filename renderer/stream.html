<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>【配信用の窓】OverLIVE</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;-webkit-app-region:drag}
#v,#hud{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
#v{object-fit:fill;background:#000}
#hud{background:transparent;color-scheme:normal;pointer-events:none}
#msg{position:absolute;left:0;right:0;top:42%;text-align:center;color:#cfe;font:600 18px/1.6 sans-serif;text-shadow:0 0 6px #000}
#msg small{display:block;font-weight:400;font-size:13px;opacity:.8}
</style></head>
<body>
<video id="v" autoplay muted playsinline></video>
<iframe id="hud" src="/renderer/hud.html?part=obs" allowtransparency="true" title="HUD"></iframe>
<iframe id="cm" src="/renderer/comments.html?full=1" allowtransparency="true" title="コメント" style="position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:transparent;pointer-events:none"></iframe>
<iframe id="np" src="/renderer/nowplaying.html?full=1" allowtransparency="true" title="再生中の曲" style="position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:transparent;pointer-events:none"></iframe>
<div id="msg">ゲーム（Apex Legends）を起動すると、ここにゲーム画面が映ります<small>この窓を配信アプリの「ウィンドウキャプチャ」で選んでください。最小化すると止まります。ドラッグで動かせます。閉じるときはメニューの「配信用の窓を閉じる」</small></div>
<script src="stream.js"></script>
</body></html>
