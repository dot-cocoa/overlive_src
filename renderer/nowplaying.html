<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>OverLIVE 再生中の曲</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%}
/* 2026-11-02：再生中の曲（ブラウザの YouTube など）。左にサムネイルのジャケット、右に曲名とチャンネル。コメント欄と同じ水色の枠 */
#card{position:absolute;width:440px;height:112px;transform-origin:0 0;opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s cubic-bezier(.2,.9,.25,1.15)}
#card.show{opacity:1;transform:none}
#card.paused{opacity:.55}
#bg{position:absolute;inset:0;clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
 background:linear-gradient(90deg,rgba(33,67,122,var(--a)),rgba(22,48,92,var(--a)))}
#line{position:absolute;inset:0;pointer-events:none}
/* 2026-11-03：ジャケットが回るデザイン（ユーザー）。ジャケットを円盤（CD）の盤面にして、再生中は回る・一時停止で止まる。
   溝・中央の穴・ふちの光は回る盤の上に重ね、光の反射（#sheen）だけは回さない（本物の盤のように見せるため） */
#disc{position:absolute;left:8px;top:6px;width:100px;height:100px}
#jk{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:conic-gradient(from 0deg,#2a5fae,#16305c,#3a78c8,#16305c,#2a5fae);
 box-shadow:0 0 0 2px #b5e9fe,0 0 14px rgba(30,140,255,.75);animation:spin 5s linear infinite}
#card.paused #jk{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
#jk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#jk .note{display:none!important}   /* 11/03 ユーザー：回っているとき ♪ は邪魔なので出さない（ジャケットがないときは色の盤だけが回る） */
#jk::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
 background:repeating-radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.10) 2px 3px),
  radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 62%,rgba(0,0,0,.25) 100%)}
#sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
 background:conic-gradient(from 20deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.28) 25deg,rgba(255,255,255,0) 55deg,rgba(255,255,255,0) 200deg,rgba(181,233,254,.22) 225deg,rgba(255,255,255,0) 255deg)}
#hole{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;
 background:radial-gradient(circle,#0b1a33 0 4px,rgba(181,233,254,.9) 4.5px 5.5px,rgba(22,48,92,.92) 6px 11px,#b5e9fe 11.5px 12.5px,transparent 13px);
 box-shadow:0 0 6px rgba(0,0,0,.5)}
#tag{position:absolute;left:118px;top:12px;display:flex;align-items:center;gap:8px;font-family:'Oxanium','Segoe UI',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;color:#ffb7dc}
#eq{display:flex;gap:2px;align-items:flex-end;height:14px}
#eq i{width:3px;background:#9fe6ff;border-radius:1px;height:4px}
#card:not(.paused) #eq i{animation:eq .9s ease-in-out infinite}
#eq i:nth-child(2){animation-delay:-.3s!important}#eq i:nth-child(3){animation-delay:-.6s!important}#eq i:nth-child(4){animation-delay:-.15s!important}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
#tw{position:absolute;left:118px;right:16px;top:36px;height:32px;overflow:hidden;white-space:nowrap}
#title{display:inline-block;font-family:'M PLUS Rounded 1c','Yu Gothic UI','Meiryo',sans-serif;font-weight:800;font-size:24px;color:#fff;
 text-shadow:0 0 3px #0b1a33,0 0 2px #0b1a33;padding-right:60px}
#title.scroll{animation:mq var(--d,12s) linear infinite}
@keyframes mq{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(calc(-1 * var(--w)))}}
#artist{position:absolute;left:118px;right:16px;top:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 font-family:'M PLUS Rounded 1c','Yu Gothic UI','Meiryo',sans-serif;font-weight:700;font-size:18px;color:#9fe6ff;text-shadow:0 0 3px #0b1a33}
</style></head>
<body>
<div id="card">
 <div id="bg"></div>
 <svg id="line" viewBox="0 0 440 112" width="440" height="112">
  <defs><filter id="gl" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="3"/></filter></defs>
  <path d="M18,1 L439,1 L439,94 L421,111 L1,111 L1,18 Z" fill="none" stroke="#1e8cff" stroke-width="6" opacity=".5" filter="url(#gl)"/>
  <path d="M18,1.5 L438.5,1.5 L438.5,94 L421,110.5 L1.5,110.5 L1.5,18 Z" fill="none" stroke="#b5e9fe" stroke-width="2.4" stroke-linejoin="round"/>
 </svg>
 <div id="disc"><div id="jk"><div class="note">♪</div></div><div id="sheen"></div><div id="hole"></div></div>
 <div id="tag"><span id="eq"><i></i><i></i><i></i><i></i></span>NOW PLAYING</div>
 <div id="tw"><span id="title"></span></div>
 <div id="artist"></div>
</div>
<script src="nowplaying.js"></script>
</body></html>
